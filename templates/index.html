
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>F1 Racing Analytics</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #e10600;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            font-size: 30px;
        }

        header p {
            margin-top: 8px;
            color: #eee;
        }

        .intro {
            text-align: center;
            padding: 25px 15px;
        }

        .intro h2 {
            margin-bottom: 10px;
        }

        .dashboard {
            width: 96%;
            margin: 0 auto 30px;
        }

        .tableauPlaceholder {
            width: 100%;
            position: relative;
        }

        .tableauViz {
            width: 100%;
        }

        footer {
            background: #222;
            text-align: center;
            padding: 18px;
            color: #aaa;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>F1 RACING ANALYTICS</h1>
        <p>Formula 1 Data Visualization Project</p>
    </header>

    <section class="intro">
        <h2>Explore Formula 1 Data</h2>
        <p>
            Analyze driver performance, team standings,
            race circuits, lap times and tyre statistics.
        </p>
    </section>

    <section class="dashboard">

        <div class="tableauPlaceholder" id="f1Dashboard">

            <object class="tableauViz" style="display:none;">

                <param name="host_url"
                       value="https://public.tableau.com/" />

                <param name="embed_code_version" value="3" />

                <param name="site_root" value="" />

                <param name="name"
                       value="F1_racing/F1RACINGANALYTICS" />

                <param name="tabs" value="no" />

                <param name="toolbar" value="yes" />

                <param name="animate_transition" value="yes" />

                <param name="display_static_image" value="yes" />

                <param name="display_spinner" value="yes" />

                <param name="display_overlay" value="yes" />

                <param name="display_count" value="yes" />

                <param name="language" value="en-US" />

                <param name="filter" value="publish=yes" />

            </object>

        </div>

    </section>

    <footer>
        <p>F1 Racing Analytics | Data Visualization using Tableau</p>
    </footer>

    <script type="text/javascript">

        var divElement = document.getElementById("f1Dashboard");

        var vizElement =
            divElement.getElementsByTagName("object")[0];

        vizElement.style.width = "100%";
        vizElement.style.height =
            window.innerWidth <= 500 ? "3027px" : "950px";

        var scriptElement = document.createElement("script");

        scriptElement.src =
            "https://public.tableau.com/javascripts/api/viz_v1.js";

        vizElement.parentNode.insertBefore(
            scriptElement,
            vizElement
        );

    </script>

</body>
</html>
